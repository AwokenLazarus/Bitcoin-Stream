  - 2.png
  - 3.png
releaseNotes: >-
  0.1.0: first local package (AGP-040) of the signer, the anchor witness, the MCP server and the web UI.
dependencies:
  - lazarus-xbt-knots
path: ""
defaultUsername: ""
deterministicPassword: true
submitter: Lazarus
submission: unpublished-local
icon: ""
