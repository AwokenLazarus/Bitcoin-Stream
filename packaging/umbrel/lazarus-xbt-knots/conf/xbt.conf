# XBT (BLAKE2b) Knots 29.4.2, pruned. RDTS (BIP 110) is consensus from the fork height: do not set
# rdtsexpiry=0. Peers are the exclusive BLAKE2b ones (peers.conf); no SHA256d seeds.
server=1
listen=1
prune=550
txindex=0
dnsseed=0
fixedseeds=0
discover=0
listenonion=0
bind=0.0.0.0
rpcbind=0.0.0.0
rpcallowip=0.0.0.0/0
rpcport=8332
port=8333
# read-only chain status for app_proxy (/rest/chaininfo.json); no wallet or key data
rest=1
