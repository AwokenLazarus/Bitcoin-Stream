[workspace]
resolver = "2"
members = ["crates/xbt-primitives", "crates/xbt402", "crates/xbt402-interop", "crates/xbt-signer", "crates/xbt-electrum", "crates/xbt-wallet-mcp", "crates/xbt-svc", "crates/xbt-wallet-ui", "crates/xbt-work", "crates/xbt-work-relay"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# 1.89: std `File::try_lock`, the ledger file lock (AGP-067)
rust-version = "1.89"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
secp256k1 = { version = "0.29.1", features = ["global-context", "std"] }
sha2 = "0.10.9"
ripemd = "0.1.3"
blake2 = "0.10.6"
hmac = "0.12.1"
hex = "0.4.3"
thiserror = "2.0"
ruint = { version = "1.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
base64 = "0.22"
ureq = "2.12"
xbt-primitives = { path = "crates/xbt-primitives" }
xbt402 = { path = "crates/xbt402" }
xbt-signer = { path = "crates/xbt-signer" }
xbt-electrum = { path = "crates/xbt-electrum" }
xbt-svc = { path = "crates/xbt-svc" }
xbt-work = { path = "crates/xbt-work" }

# scrypt (the UI login hash, the signer's passphrase keystore) is unusably slow unoptimised in tests
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# Size-optimised release: fat LTO, opt-level z. scripts/build_matrix.sh reports both.
[profile.release-small]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
