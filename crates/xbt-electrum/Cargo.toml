[package]
name = "xbt-electrum"
description = "A light XBT chain backend: Electrum servers checked against our own BLAKE2b header chain and Merkle proofs (xbt402 ChainBackend)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# a simulated chain and an Electrum server with knobs for lying (tests, and the TLS proxy of the interop run)
sim = []
# the regtest interop tool: a Rust payer on this backend against any xbt402 provider (node = faucet, miner, oracle)
interop = ["sim", "xbt402/http-client", "xbt402/rpc"]

[dependencies]
xbt-primitives.workspace = true
xbt402.workspace = true
serde_json.workspace = true
hex.workspace = true
thiserror.workspace = true
# portable TLS: rustls on ring (no OpenSSL), Mozilla roots compiled in, optional extra CA from PEM
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
webpki-roots = "0.26"

[dev-dependencies]
xbt-electrum = { path = ".", features = ["sim"] }

[[bin]]
name = "xbt-electrum-interop"
path = "src/bin/xbt-electrum-interop.rs"
required-features = ["interop"]
